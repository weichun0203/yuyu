        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;700&display=swap');
        
        body {

        .current-time-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 2px dashed #d4a59a;
            z-index: 35;
            pointer-events: none;
        }
        .current-time-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #d4a59a;
            border-radius: 50%;
            left: -4px;
            top: -4px;
        }

        /* 日曆視圖基礎樣式 (融入紙張質感) */
        .calendar-wrapper {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.7); /* 半透明白，透出噪點 */
            backdrop-filter: blur(4px);
        }
        .calendar-header {
            position: sticky;
            top: 0;
            z-index: 50; 
            background: rgba(253, 251, 247, 0.95); /* brand-paper */
            backdrop-filter: blur(8px);
        }
        .calendar-grid-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            /* 限制手機版只允許上下垂直捲動，水平滑動交由 JS 手勢判定 */
            touch-action: pan-y; 
        }
        .calendar-grid {
            display: flex;
            position: relative;
            width: 100%;
        }
        @media (min-width: 768px) {
            .calendar-grid { min-width: 800px; }
            .calendar-grid-container { overflow-x: auto; }
        }

        .time-axis {
            width: 50px;
            flex-shrink: 0;
            border-right: 1px solid #e6e2dd;
            background-color: transparent;
            position: sticky;
            left: 0;
            z-index: 40; 
        }
        @media (min-width: 768px) {
            .time-axis { width: 60px; }
        }

        .day-column {
            flex: 1;
            border-right: 1px solid #e6e2dd;
            position: relative;
        }
        .day-column:last-child {
            border-right: none;
        }
        
        .time-slot-line {
            position: absolute;
            width: 100%;
            border-bottom: 1px dashed #e6e2dd;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .event-card {
            position: absolute;
            border-radius: 6px;
            padding: 4px 6px;
            font-size: 0.75rem;
            line-height: 1.25;
            overflow: hidden;
            z-index: 10;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            border-left-width: 4px;
            user-select: none;
            -webkit-user-select: none;
        }
        @media (min-width: 768px) {
            .event-card { padding: 4px 8px; }
        }
        .event-card:hover {
            z-index: 30;
            transform: scale(1.01);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); /* brand-soft */
        }
        
        /* 自訂顏色選擇器 */
        .color-option input:checked + div {
            transform: scale(1.15);
            box-shadow: 0 0 0 2px #fdfbf7, 0 0 0 4px #8da399; /* brand-sage ring */
        }

        /* Modal 動畫 */
        .modal-content {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-enter .modal-content {
            transform: translateY(0);
        }
        @media (min-width: 768px) {
            .modal-content {
                transform: scale(0.95);
                opacity: 0;
            }
            .modal-enter .modal-content {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Toast 提示動畫 */
        .toast-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) translateX(-50%); }
            to { opacity: 1; transform: translateY(0) translateX(-50%); }
        }

        /* 手機版左右滑動切換時的淡入動效 */
        @keyframes dayFadeIn {
            from { opacity: 0; transform: translateY(2px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mobile-fade-active {
            animation: dayFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;

            { id: 'f20', day: 6, start: '08:00', end: '09:00', title: '新莊(幸福路)', type: 'fixed', color: 'fixed' },
            { id: 'f21', day: 6, start: '11:00', end: '12:30', title: '龜山(大湖一路)', type: 'fixed', color: 'fixed' },
            { id: 'f22', day: 6, start: '12:45', end: '14:15', title: '龜山(大湖一路)', type: 'fixed', color: 'fixed' },
            { id: 'f23', day: 6, start: '14:30', end: '15:30', title: '龜山(大湖一路)', type: 'fixed', color: 'fixed' },
            { id: 'f24', day: 6, start: '16:00', end: '17:00', title: '林口', type: 'fixed', color: 'fixed' },
            { id: 'f25', day: 6, start: '17:30', end: '18:30', title: '林口(夢想之都)', type: 'fixed', color: 'fixed' }
        ];

        // 讀取 Local Storage 資料
        let events = [];
        try {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                events = JSON.parse(savedData);
            } else {
                events = JSON.parse(JSON.stringify(defaultEvents));
                saveDataToStorage();
            }
        } catch (e) {
            console.error("無法讀取儲存空間:", e);
            events = JSON.parse(JSON.stringify(defaultEvents));
        }

        function saveDataToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
            } catch (e) {
                console.error("儲存失敗:", e);
                showToast('瀏覽器儲存空間異常，資料可能遺失。');
            }
        }

        // 工具函數
        function timeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return (hours - START_HOUR) * 60 + minutes;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden');
            toast.classList.add('toast-enter');
            
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-enter');
            }, 2500);
        }

        // --- 手機版視圖切換邏輯 ---
        function changeMobileDay(delta) {
            currentMobileDay += delta;
            if (currentMobileDay > 7) currentMobileDay = 1;
            if (currentMobileDay < 1) currentMobileDay = 7;
            
            document.getElementById('mobile-day-label').innerText = dayNames[currentMobileDay];
            applyMobileViewFilter();
        }

        function applyMobileViewFilter() {
            for (let i = 1; i <= 7; i++) {
                const header = document.getElementById(`day-header-${i}`);
                const col = document.getElementById(`day-col-${i}`);
                
                if (i === currentMobileDay) {
                    if(header) { 
                        header.classList.remove('hidden'); 
                        header.classList.add('block', 'md:block'); 
                    }
                    if(col) { 
                        col.classList.remove('hidden'); 
                        col.classList.add('block', 'md:block'); 
                        // 在手機版切換時加入精緻的淡入微動效
                        if (window.innerWidth < 768) {
                            col.classList.remove('mobile-fade-active');
                            void col.offsetWidth; // 強制瀏覽器重繪 (reflow)
                            col.classList.add('mobile-fade-active');
                        }
                    }
                } else {
                    if(header) { 
                        header.classList.add('hidden', 'md:block'); 
                        header.classList.remove('block'); 
                    }
                    if(col) { 
                        col.classList.add('hidden', 'md:block'); 
                        col.classList.remove('block', 'mobile-fade-active'); 
                    }
                }
            }
            updateCurrentTime();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const headerRow = document.getElementById('calendar-header-row');
            const linesContainer = document.getElementById('grid-lines-container');
            
            const oldCols = grid.querySelectorAll('.day-column');
            oldCols.forEach(col => col.remove());
            
            const oldTimeAxis = grid.querySelector('.time-axis');
            if(oldTimeAxis) oldTimeAxis.remove();
            
            const oldHeaders = headerRow.querySelectorAll('.day-header-cell');
            oldHeaders.forEach(h => h.remove());
            
            linesContainer.innerHTML = '';

            const totalHours = END_HOUR - START_HOUR;
            const totalHeight = totalHours * 60 * PIXELS_PER_MINUTE;
            grid.style.height = `${totalHeight}px`;

            // 1. 渲染水平網格虛線 (品牌化沙色)
            for (let i = 0; i <= totalHours; i++) {
                const line = document.createElement('div');
                line.className = 'absolute w-full border-b border-brand-sand';
                line.style.top = `${i * 60 * PIXELS_PER_MINUTE}px`;
                if(i !== totalHours) {
                    const halfLine = document.createElement('div');
                    halfLine.className = 'absolute w-full border-b border-dashed border-brand-sand/50';
                    halfLine.style.top = `${(i + 0.5) * 60 * PIXELS_PER_MINUTE}px`;
                    linesContainer.appendChild(halfLine);
                }
                linesContainer.appendChild(line);
            }

            // 2. 渲染左側時間軸
            const timeAxis = document.createElement('div');
            timeAxis.className = 'time-axis relative';
            for (let i = 0; i <= totalHours; i++) {
                const hour = START_HOUR + i;
                const label = document.createElement('div');
                label.className = 'absolute w-full text-center md:text-right md:pr-2 text-[10px] md:text-xs text-brand-ink/60 font-medium';
                label.style.top = `${i * 60 * PIXELS_PER_MINUTE - 8}px`; 
                label.innerText = `${hour.toString().padStart(2, '0')}:00`;
                timeAxis.appendChild(label);
            }
            grid.appendChild(timeAxis);

            // 3. 渲染 7 天的欄位與表頭
            for (let day = 1; day <= 7; day++) {
                const headerCell = document.createElement('div');
                headerCell.id = `day-header-${day}`;
                headerCell.className = `day-header-cell flex-1 text-center py-3 md:py-4 font-bold text-brand-ink border-r border-brand-sand hidden md:block tracking-wide`;
                
                const today = new Date().getDay() || 7;
                if (day === today) {
                    headerCell.innerHTML = `<span class="bg-brand-sage text-brand-paper px-3 py-1 rounded-full text-sm shadow-sm">${dayNames[day]}</span>`;
                } else {
                    headerCell.innerText = dayNames[day];
                }
                headerRow.appendChild(headerCell);

                const col = document.createElement('div');
                col.id = `day-col-${day}`;
                col.className = 'day-column cursor-pointer hover:bg-brand-sand/20 transition-colors hidden md:block z-10'; 
                
                col.addEventListener('click', (e) => {
                    if (e.target.closest('.event-card')) return;
                    const rect = col.getBoundingClientRect();
                    const y = e.clientY - rect.top;
                    let clickedMinutes = (y / PIXELS_PER_MINUTE) + (START_HOUR * 60);
                    
                    clickedMinutes = Math.floor(clickedMinutes / 30) * 30;
                    clickedMinutes = Math.max(START_HOUR * 60, Math.min((END_HOUR * 60) - 30, clickedMinutes));
                    
                    const startHour = Math.floor(clickedMinutes / 60).toString().padStart(2, '0');
                    const startMin = (clickedMinutes % 60).toString().padStart(2, '0');
                    const startStr = `${startHour}:${startMin}`;

                    let endMinutes = clickedMinutes + 60; 
                    endMinutes = Math.min(END_HOUR * 60, endMinutes); 
                    const endHour = Math.floor(endMinutes / 60).toString().padStart(2, '0');
                    const endMin = (endMinutes % 60).toString().padStart(2, '0');
                    const endStr = `${endHour}:${endMin}`;

                    openModal(day.toString(), startStr, endStr);
                });
                
                const dayEvents = events.filter(e => parseInt(e.day) === day);
                dayEvents.sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
                
                let clusters = [];
                let currentCluster = [];
                let clusterEnd = -1;

                dayEvents.forEach(event => {
                    const startMin = timeToMinutes(event.start);
                    const endMin = timeToMinutes(event.end);
                    if (currentCluster.length === 0) {
                        currentCluster.push(event);
                        clusterEnd = endMin;
                    } else if (startMin < clusterEnd) {
                        currentCluster.push(event);
                        clusterEnd = Math.max(clusterEnd, endMin);
                    } else {
                        clusters.push(currentCluster);
                        currentCluster = [event];
                        clusterEnd = endMin;
                    }
                });
                if (currentCluster.length > 0) clusters.push(currentCluster);

                clusters.forEach(cluster => {
                    let cols = [];
                    cluster.forEach(event => {
                        const startMin = timeToMinutes(event.start);
                        let placed = false;
                        for (let i = 0; i < cols.length; i++) {
                            const lastEventEnd = timeToMinutes(cols[i][cols[i].length - 1].end);
                            if (startMin >= lastEventEnd) {
                                cols[i].push(event);
                                event.colIndex = i;
                                placed = true;
                                break;
                            }
                        }
                        if (!placed) {
                            cols.push([event]);
                            event.colIndex = cols.length - 1;
                        }
                    });
                    cluster.forEach(event => { event.numCols = cols.length; });
                });

                dayEvents.forEach(event => {
                    const topMin = timeToMinutes(event.start);
                    const endMin = timeToMinutes(event.end);
                    const duration = endMin - topMin;
                    
                    const el = document.createElement('div');
                    // 確保使用設定好的品牌顏色
                    let eventColor = event.color;
                    if (!themeClasses[eventColor]) eventColor = event.type === 'fixed' ? 'fixed' : 'sage';
                    const colorClass = themeClasses[eventColor];
                    
                    el.className = `event-card flex flex-col backdrop-blur-[2px] ${colorClass}`;
                    el.style.top = `${topMin * PIXELS_PER_MINUTE}px`;
                    el.style.height = `${duration * PIXELS_PER_MINUTE}px`;
                    
                    const leftPercent = (event.colIndex / event.numCols) * 100;
                    const widthPercent = (1 / event.numCols) * 100;
                    el.style.left = `calc(${leftPercent}% + 2px)`;
                    el.style.width = `calc(${widthPercent}% - 4px)`;
                    
                    let innerHTML = `
                        <div class="font-bold truncate text-[11px] md:text-sm leading-tight tracking-wide ${event.type !== 'fixed' ? 'pr-4' : ''}">${event.title}</div>
                        <div class="text-[9px] md:text-[10px] opacity-70 mt-[1px] md:mt-0.5 flex items-center font-medium">
                            <i class="fa-regular fa-clock mr-1 scale-75 hidden md:inline"></i>${event.start}
                        </div>
                    `;
                    
                    if (event.type !== 'fixed') {
                        innerHTML += `
                            <button onclick="deletePlanQuick(event, '${event.id}')" class="absolute top-0.5 right-0.5 md:top-1 md:right-1 w-5 h-5 flex items-center justify-center rounded-full hover:bg-brand-ink/10 text-current opacity-40 hover:opacity-100 transition-all z-20">
                                <i class="fa-solid fa-xmark text-[10px] md:text-xs"></i>
                            </button>
                        `;
                    }
                    
                    if (event.notes) {
                        innerHTML += `<div class="mt-auto text-[9px] opacity-60 truncate font-medium"><i class="fa-solid fa-feather-pointed mr-1"></i><span class="hidden md:inline">${event.notes}</span></div>`;
                    }
                    el.innerHTML = innerHTML;
                    
                    el.addEventListener('click', (e) => {
                        e.stopPropagation(); 
                        editPlan(event.id);
                    });
                    
                    col.appendChild(el);
                });

                grid.appendChild(col);
            }
            
            applyMobileViewFilter();
            document.getElementById('mobile-day-label').innerText = dayNames[currentMobileDay];
        }

        const modal = document.getElementById('plan-modal');

        function showError(msg) {
            const errorDiv = document.getElementById('error-msg');
            document.getElementById('error-text').innerText = msg;
            errorDiv.classList.remove('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 3500);
        }

        function openModalFromButton() {
            const isMobile = window.innerWidth < 768;
            let targetDay = isMobile ? currentMobileDay.toString() : (new Date().getDay() || 7).toString();
            openModal(targetDay, '12:00', '13:00');
        }

        function openModal(defaultDay = '1', defaultStart = '12:00', defaultEnd = '13:00', editData = null) {
            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modal.classList.add('flex', 'modal-enter');
            modal.classList.remove('opacity-0');
            
            document.getElementById('error-msg').classList.add('hidden');
            
            const isFixed = editData && editData.type === 'fixed';
            
            const fixedInputs = ['plan-title', 'plan-day', 'plan-start', 'plan-end'];
            fixedInputs.forEach(id => {
                const el = document.getElementById(id);
                el.disabled = isFixed;
                if(isFixed) {
                    el.classList.add('bg-brand-sand/30', 'text-brand-ink/50');
                    el.classList.remove('bg-white/80');
                } else {
                    el.classList.remove('bg-brand-sand/30', 'text-brand-ink/50');
                    el.classList.add('bg-white/80');
                }
            });
            
            if (editData) {
                document.getElementById('modal-title').innerHTML = isFixed ? '<i class="fa-solid fa-thumbtack text-brand-clay mr-3"></i>標籤 / 備註' : '<i class="fa-solid fa-pen-nib text-brand-sage mr-3"></i>編輯計畫';
                document.getElementById('plan-id').value = editData.id;
                document.getElementById('plan-title').value = editData.title;
                document.getElementById('plan-day').value = editData.day;
                document.getElementById('plan-start').value = editData.start;
                document.getElementById('plan-end').value = editData.end;
                document.getElementById('plan-notes').value = editData.notes || '';
                
                const radios = document.getElementsByName('plan-color');
                const targetColor = editData.color === 'fixed' ? 'sand' : (editData.color || 'sage');
                for(let r of radios) { r.checked = (r.value === targetColor); }
                
                if (isFixed) {
                    document.getElementById('delete-btn').classList.add('hidden');
                } else {
                    document.getElementById('delete-btn').classList.remove('hidden');
                }
            } else {
                document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-pen-nib text-brand-sage mr-3"></i>新增計畫';
                document.getElementById('plan-id').value = '';
                document.getElementById('plan-title').value = '';
                document.getElementById('plan-day').value = defaultDay;
                document.getElementById('plan-start').value = defaultStart;
                document.getElementById('plan-end').value = defaultEnd;
                document.getElementById('plan-notes').value = '';
                
                document.getElementsByName('plan-color')[0].checked = true; // Default Sage
                
                document.getElementById('delete-btn').classList.add('hidden');
            }
            
            if (!isFixed && window.innerWidth >= 768) {
                setTimeout(() => document.getElementById('plan-title').focus(), 300);
            }
        }
        
        function editPlan(id) {
            const plan = events.find(e => e.id === id);
            if (plan) openModal(plan.day, plan.start, plan.end, plan);
        }

        function closeModal() {
            modal.classList.remove('modal-enter');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300); 
        }

        function savePlan() {
            const id = document.getElementById('plan-id').value;
            const title = document.getElementById('plan-title').value.trim();
            const day = document.getElementById('plan-day').value;
            const start = document.getElementById('plan-start').value;
            const end = document.getElementById('plan-end').value;
            const notes = document.getElementById('plan-notes').value.trim();
            
            let color = 'sage';
            const colorRadios = document.getElementsByName('plan-color');
            for(let r of colorRadios) { if(r.checked) color = r.value; }

            const existingPlanIndex = id ? events.findIndex(e => e.id === id) : -1;
            const isFixed = existingPlanIndex !== -1 && events[existingPlanIndex].type === 'fixed';

            if (!isFixed) {
                if (!title) { showError('請填寫計畫名稱'); return; }
                if (!start || !end) { showError('請設定完整的時間'); return; }
                if (start >= end) { showError('結束時間必須晚於開始時間'); return; }
                if (timeToMinutes(start) < 0 || timeToMinutes(end) > (END_HOUR - START_HOUR) * 60) {
                    showError(`時間需在 ${START_HOUR}:00 至 ${END_HOUR}:00 之間`); return;
                }
            }

            if (id && existingPlanIndex !== -1) {
                if (isFixed) {
                    events[existingPlanIndex].notes = notes;
                    events[existingPlanIndex].color = color;
                } else {
                    events[existingPlanIndex] = { ...events[existingPlanIndex], title, day: parseInt(day), start, end, notes, color };
                }
                showToast('計畫已更新');
            } else {
                const planData = { id: 'custom_' + Date.now(), day: parseInt(day), start, end, title, type: 'custom', color, notes };
                events.push(planData);
                showToast('已新增計畫');
                
                if(window.innerWidth < 768 && currentMobileDay !== parseInt(day)) {
                    currentMobileDay = parseInt(day);
                }
            }

            saveDataToStorage();
            closeModal();
            renderCalendar();
        }

        function deleteCurrentPlan() {
            const id = document.getElementById('plan-id').value;
            if(id) {
                events = events.filter(e => e.id !== id);
                saveDataToStorage();
                closeModal();
                renderCalendar();
                showToast('計畫已刪除');
            }
        }

        function deletePlanQuick(e, id) {
            e.stopPropagation(); 
            events = events.filter(ev => ev.id !== id);
            saveDataToStorage();
            closeModal(); 
            renderCalendar();
            showToast('計畫已刪除');
        }

        function updateCurrentTime() {
            const existingLine = document.getElementById('current-time-indicator');
            if (existingLine) existingLine.remove();

            const now = new Date();
            let dayOfWeek = now.getDay() || 7; 
            const hours = now.getHours();
            const minutes = now.getMinutes();
            
            if (hours >= START_HOUR && hours < END_HOUR) {
                const totalMins = (hours - START_HOUR) * 60 + minutes;
                const topPos = totalMins * PIXELS_PER_MINUTE;

                const todayCol = document.getElementById(`day-col-${dayOfWeek}`);
                if (todayCol && !todayCol.classList.contains('hidden')) {
                    const indicator = document.createElement('div');
                    indicator.id = 'current-time-indicator';
                    indicator.className = 'current-time-line';
                    indicator.style.top = `${topPos}px`;
                    
                    const dot = document.createElement('div');
                    dot.className = 'current-time-dot';
                    indicator.appendChild(dot);
                    
                    todayCol.appendChild(indicator);
                }
            }
        }

        // --- 手機版左右滑動手勢偵測 ---
        function setupSwipeGestures() {
            const scrollArea = document.getElementById('calendar-scroll-area');
            let touchstartX = 0;
            let touchstartY = 0;
            let touchendX = 0;
            let touchendY = 0;

            scrollArea.addEventListener('touchstart', (e) => {
                // 如果彈出視窗（Modal）是開啟狀態，不觸發行程表滑動切換
                if (!modal.classList.contains('hidden')) return;
                touchstartX = e.changedTouches[0].clientX;
                touchstartY = e.changedTouches[0].clientY;
            }, { passive: true });

            scrollArea.addEventListener('touchend', (e) => {
                if (!modal.classList.contains('hidden')) return;
                touchendX = e.changedTouches[0].clientX;
                touchendY = e.changedTouches[0].clientY;
                
                const diffX = touchendX - touchstartX;
                const diffY = touchendY - touchstartY;
                
                // 觸發門檻：
                // 1. 僅在手機版（視窗寬度 < 768px）生效
                // 2. 水平移動位移必須大於 50 像素（防止極微小誤觸）
                // 3. 水平移動位移必須大於垂直位移（防止與上下捲動時間軸衝突）
                if (window.innerWidth < 768 && Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 0) {
                        // 從左向右滑動（Swipe Right） -> 切換至「前一天」
                        changeMobileDay(-1);
                    } else {
                        // 從右向左滑動（Swipe Left） -> 切換至「後一天」
                        changeMobileDay(1);
                    }
                }
            }, { passive: true });
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                applyMobileViewFilter();
            }, 100);
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            
            const now = new Date();
            const hours = now.getHours();
            const scrollArea = document.getElementById('calendar-scroll-area');
            
            if (hours >= START_HOUR && hours < END_HOUR) {
                scrollArea.scrollTop = Math.max(0, (hours - START_HOUR - 1) * 60 * PIXELS_PER_MINUTE);
            } else {
                scrollArea.scrollTop = 2 * 60 * PIXELS_PER_MINUTE; 
            }
            
            // 啟用滑動手勢
            setupSwipeGestures();
            
            setInterval(updateCurrentTime, 60000);
        });
    </script>
</body>
</html>
