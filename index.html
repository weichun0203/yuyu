<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每週行程計畫表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            /* 避免 iOS 彈性滾動造成的怪異體驗 */
            overscroll-behavior-y: none; 
        }
        
        /* 隱藏原生滾動條，使用自訂樣式 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 當前時間紅線樣式 */
        .current-time-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 2px dashed #ef4444;
            z-index: 35;
            pointer-events: none;
        }
        .current-time-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            left: -4px;
            top: -4px;
        }

        /* 日曆視圖基礎樣式 */
        .calendar-wrapper {
            display: flex;
            flex-direction: column;
            background: white;
        }
        .calendar-header {
            position: sticky;
            top: 0;
            z-index: 50; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            background: #f1f5f9;
        }
        .calendar-grid-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        .calendar-grid {
            display: flex;
            position: relative;
            background-color: white;
            width: 100%;
        }
        /* 電腦版強制寬度以保持 7 天排版 */
        @media (min-width: 768px) {
            .calendar-grid { min-width: 800px; }
            .calendar-grid-container { overflow-x: auto; }
        }

        .time-axis {
            width: 50px;
            flex-shrink: 0;
            border-right: 1px solid #e2e8f0;
            background-color: #f8fafc;
            position: sticky;
            left: 0;
            z-index: 40; 
        }
        @media (min-width: 768px) {
            .time-axis { width: 60px; }
        }

        .day-column {
            flex: 1;
            border-right: 1px solid #e2e8f0;
            position: relative;
        }
        .day-column:last-child {
            border-right: none;
        }
        
        .time-slot-line {
            position: absolute;
            width: 100%;
            border-bottom: 1px dashed #e2e8f0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .event-card {
            position: absolute;
            border-radius: 6px;
            padding: 4px 6px;
            font-size: 0.75rem;
            line-height: 1.25;
            overflow: hidden;
            z-index: 10;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            border-left-width: 4px;
            /* 預防文字選取干擾觸控 */
            user-select: none;
            -webkit-user-select: none;
        }
        @media (min-width: 768px) {
            .event-card { padding: 4px 8px; }
        }
        .event-card:hover {
            z-index: 30;
            transform: scale(1.02);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        
        /* 自訂顏色選擇器 */
        .color-option input:checked + div {
            transform: scale(1.15);
            box-shadow: 0 0 0 2px white, 0 0 0 4px #cbd5e1;
        }

        /* Modal 手機版由下往上滑出設計 */
        .modal-content {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-enter .modal-content {
            transform: translateY(0);
        }
        @media (min-width: 768px) {
            .modal-content {
                transform: scale(0.95);
                opacity: 0;
            }
            .modal-enter .modal-content {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Toast 提示動畫 */
        .toast-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) translateX(-50%); }
            to { opacity: 1; transform: translateY(0) translateX(-50%); }
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col h-[100dvh] overflow-hidden">
    
    <!-- -->
    <header class="bg-white shadow-sm z-20 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 py-3 md:py-4 flex flex-col md:flex-row justify-between md:items-center gap-3">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-slate-900 flex items-center">
                        <i class="fa-regular fa-calendar-days text-blue-600 mr-2"></i>行程計畫表
                    </h1>
                </div>
                <!-- 電腦版新增按鈕 -->
                <button onclick="openModalFromButton()" class="hidden md:flex bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors items-center text-sm">
                    <i class="fa-solid fa-plus mr-2"></i>新增計畫
                </button>
            </div>
            
            <div class="flex items-center justify-between md:justify-end gap-4">
                <div class="flex items-center text-xs gap-3 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                    <span class="flex items-center text-slate-600 font-medium"><span class="w-3 h-3 rounded bg-blue-100 border border-blue-400 mr-1.5"></span>固定</span>
                    <span class="flex items-center text-slate-600 font-medium"><span class="w-3 h-3 rounded bg-green-100 border border-green-400 mr-1.5"></span>我的計畫</span>
                </div>
                
                <!-- 手機版日期切換器 -->
                <div class="md:hidden flex items-center bg-blue-50 text-blue-700 rounded-lg px-2 py-1 shadow-inner border border-blue-100">
                    <button onclick="changeMobileDay(-1)" class="w-8 h-8 flex items-center justify-center rounded hover:bg-blue-200 transition-colors"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="mobile-day-label" class="font-bold w-12 text-center text-sm">週一</span>
                    <button onclick="changeMobileDay(1)" class="w-8 h-8 flex items-center justify-center rounded hover:bg-blue-200 transition-colors"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </header>

    <!-- -->
    <div class="flex-1 w-full flex flex-col overflow-hidden max-w-7xl mx-auto md:p-4 bg-slate-50 md:bg-transparent">
        <div class="calendar-wrapper flex-1 md:rounded-xl shadow-sm border-t md:border border-slate-200 overflow-hidden relative">
            
            <!-- 星期標題列 -->
            <div class="calendar-header flex border-b border-slate-200" id="calendar-header-row">
                <div class="time-axis border-none bg-transparent"></div> <!-- 左上角留白 -->
                <!-- JS 動態生成 7 天的表頭 -->
            </div>

            <!-- 時間軸與事件網格 -->
            <div class="calendar-grid-container" id="calendar-scroll-area">
                <div class="calendar-grid" id="calendar-grid">
                    <!-- 背景水平網格線 -->
                    <div id="grid-lines-container" class="absolute inset-0 pointer-events-none z-0 ml-[50px] md:ml-[60px]"></div>
                    <!-- 內容由 JS 動態生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 手機版懸浮新增按鈕 (FAB) -->
    <button onclick="openModalFromButton()" class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-[0_4px_12px_rgba(37,99,235,0.4)] flex items-center justify-center text-2xl z-[60] active:scale-95 transition-transform">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- -->
    <!-- 新增/編輯計畫 Modal -->
    <div id="plan-modal" class="fixed inset-0 bg-slate-900/40 hidden items-end md:items-center justify-center z-[100] backdrop-blur-sm transition-opacity opacity-0">
        <div class="modal-content bg-white w-full max-w-md rounded-t-2xl md:rounded-2xl shadow-xl flex flex-col max-h-[90vh]">
            
            <div class="p-4 md:p-6 border-b border-slate-100 flex justify-between items-center bg-white rounded-t-2xl">
                <h2 id="modal-title" class="text-lg md:text-xl font-bold flex items-center text-slate-800">
                    <i class="fa-solid fa-calendar-plus text-blue-500 mr-2"></i>新增個人計畫
                </h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-full bg-slate-50"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="p-4 md:p-6 overflow-y-auto">
                <input type="hidden" id="plan-id"> 

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">行程名稱</label>
                        <!-- 使用 text-base 防止 iOS Safari 自動放大 -->
                        <input type="text" id="plan-title" class="w-full text-base border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder-slate-300" placeholder="例如：讀書、運動、開會...">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">日期</label>
                        <select id="plan-day" class="w-full text-base border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                            <option value="1">星期一</option>
                            <option value="2">星期二</option>
                            <option value="3">星期三</option>
                            <option value="4">星期四</option>
                            <option value="5">星期五</option>
                            <option value="6">星期六</option>
                            <option value="7">星期日</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">開始時間</label>
                            <input type="time" id="plan-start" class="w-full text-base border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">結束時間</label>
                            <input type="time" id="plan-end" class="w-full text-base border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                        </div>
                    </div>

                    <!-- 顏色選擇器 -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">標籤顏色</label>
                        <div class="flex gap-4">
                            <label class="color-option cursor-pointer relative">
                                <input type="radio" name="plan-color" value="blue" class="hidden">
                                <div class="w-7 h-7 rounded-full bg-blue-400 border border-blue-500 transition-transform"></div>
                            </label>
                            <label class="color-option cursor-pointer relative">
                                <input type="radio" name="plan-color" value="green" class="hidden" checked>
                                <div class="w-7 h-7 rounded-full bg-green-400 border border-green-500 transition-transform"></div>
                            </label>
                            <label class="color-option cursor-pointer relative">
                                <input type="radio" name="plan-color" value="purple" class="hidden">
                                <div class="w-7 h-7 rounded-full bg-purple-400 border border-purple-500 transition-transform"></div>
                            </label>
                            <label class="color-option cursor-pointer relative">
                                <input type="radio" name="plan-color" value="orange" class="hidden">
                                <div class="w-7 h-7 rounded-full bg-orange-400 border border-orange-500 transition-transform"></div>
                            </label>
                            <label class="color-option cursor-pointer relative">
                                <input type="radio" name="plan-color" value="pink" class="hidden">
                                <div class="w-7 h-7 rounded-full bg-pink-400 border border-pink-500 transition-transform"></div>
                            </label>
                        </div>
                    </div>

                    <!-- 備註欄位 -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">備註事項 (選填)</label>
                        <textarea id="plan-notes" rows="2" class="w-full text-base border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder-slate-300 resize-none" placeholder="輸入詳細資訊..."></textarea>
                    </div>

                    <!-- 錯誤訊息提示區 -->
                    <div id="error-msg" class="hidden text-red-500 text-sm font-medium mt-1 bg-red-50 p-2 rounded-md flex items-center">
                        <i class="fa-solid fa-circle-exclamation mr-2 flex-shrink-0"></i><span id="error-text"></span>
                    </div>
                </div>
            </div>

            <!-- Modal 底部按鈕區 -->
            <div class="p-4 md:p-6 border-t border-slate-100 bg-slate-50/50 flex justify-between items-center rounded-b-2xl mt-auto">
                <button type="button" id="delete-btn" onclick="deleteCurrentPlan()" class="hidden text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-2.5 rounded-lg transition-colors text-sm font-bold flex items-center">
                    <i class="fa-regular fa-trash-can mr-1.5 text-lg"></i>刪除
                </button>
                <div class="flex gap-3 ml-auto w-full md:w-auto">
                    <button type="button" onclick="closeModal()" class="md:hidden flex-1 px-4 py-2.5 rounded-lg text-slate-600 bg-white border border-slate-300 font-medium active:bg-slate-50">取消</button>
                    <button type="button" id="save-btn" onclick="savePlan()" class="flex-1 md:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-lg font-bold shadow-sm transition-colors text-base">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 提示組件 -->
    <div id="toast" class="fixed bottom-[80px] md:bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-2.5 rounded-full shadow-lg text-sm font-medium z-[200] hidden flex items-center">
        <i class="fa-solid fa-check-circle text-green-400 mr-2"></i><span id="toast-msg"></span>
    </div>

    <!-- -->
    <script>
        // 設定與常數
        const START_HOUR = 6;
        const END_HOUR = 23;
        const PIXELS_PER_MINUTE = 1.5; 
        const STORAGE_KEY = 'my_weekly_schedule_data';
        
        const themeClasses = {
            blue: 'bg-blue-50 border-blue-400 text-blue-900', 
            green: 'bg-green-50 border-green-400 text-green-900 hover:bg-green-100',
            purple: 'bg-purple-50 border-purple-400 text-purple-900 hover:bg-purple-100',
            orange: 'bg-orange-50 border-orange-400 text-orange-900 hover:bg-orange-100',
            pink: 'bg-pink-50 border-pink-400 text-pink-900 hover:bg-pink-100'
        };

        const dayNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六', '週日'];
        
        // 手機版當前顯示星期 (1-7)
        let currentMobileDay = new Date().getDay() || 7; 

        // 預設固定行程
        const defaultEvents = [
            { id: 'f1', day: 1, start: '07:30', end: '08:30', title: '士林', type: 'fixed', color: 'blue' },
            { id: 'f2', day: 1, start: '08:45', end: '09:45', title: '三重', type: 'fixed', color: 'blue' },
            { id: 'f3', day: 2, start: '06:00', end: '07:00', title: '東門', type: 'fixed', color: 'blue' },
            { id: 'f4', day: 3, start: '09:30', end: '10:30', title: '龜山(大湖一路)', type: 'fixed', color: 'blue' },
            { id: 'f5', day: 3, start: '11:00', end: '12:30', title: '林口A7', type: 'fixed', color: 'blue' },
            { id: 'f6', day: 3, start: '14:00', end: '15:00', title: '龜山(復興一路)', type: 'fixed', color: 'blue' },
            { id: 'f7', day: 3, start: '18:00', end: '19:00', title: '龜山 A8', type: 'fixed', color: 'blue' },
            { id: 'f8', day: 3, start: '19:30', end: '20:30', title: '龜山(大湖一路)', type: 'fixed', color: 'blue' },
            { id: 'f9', day: 3, start: '20:30', end: '21:30', title: '龜山(大湖一路)', type: 'fixed', color: 'blue' },
            { id: 'f10', day: 4, start: '10:00', end: '12:00', title: '土城', type: 'fixed', color: 'blue' },
            { id: 'f11', day: 4, start: '13:30', end: '14:30', title: '龜山(復興一路)', type: 'fixed', color: 'blue' },
            { id: 'f12', day: 4, start: '15:00', end: '16:30', title: '龜山(文化三路)', type: 'fixed', color: 'blue' },
            { id: 'f13', day: 4, start: '16:45', end: '17:45', title: '林口', type: 'fixed', color: 'blue' },
            { id: 'f14', day: 4, start: '19:30', end: '20:30', title: '港墘', type: 'fixed', color: 'blue' },
            { id: 'f15', day: 4, start: '20:30', end: '21:30', title: '港墘', type: 'fixed', color: 'blue' },
            { id: 'f16', day: 5, start: '09:30', end: '10:30', title: '龜山(大湖一路)', type: 'fixed', color: 'blue' },
            { id: 'f17', day: 5, start: '11:00', end: '12:00', title: '中和', type: 'fixed', color: 'blue' },
            { id: 'f18', day: 5, start: '17:30', end: '18:30', title: '林口', type: 'fixed', color: 'blue' },
            { id: 'f19', day: 5, start: '19:00', end: '20:00', title: '龜山(大湖一路)', type: 'fixed', color: 'blue' },
            { id: 'f20', day: 6, start: '08:00', end: '09:00', title: '新莊(幸福路)', type: 'fixed', color: 'blue' },
            { id: 'f21', day: 6, start: '11:00', end: '12:30', title: '龜山(大湖一路)', type: 'fixed', color: 'blue' },
            { id: 'f22', day: 6, start: '12:45', end: '14:15', title: '龜山(大湖一路)', type: 'fixed', color: 'blue' },
            { id: 'f23', day: 6, start: '14:30', end: '15:30', title: '龜山(大湖一路)', type: 'fixed', color: 'blue' },
            { id: 'f24', day: 6, start: '16:00', end: '17:00', title: '林口', type: 'fixed', color: 'blue' },
            { id: 'f25', day: 6, start: '17:30', end: '18:30', title: '林口(夢想之都)', type: 'fixed', color: 'blue' }
        ];

        // 讀取 Local Storage 資料
        let events = [];
        try {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                events = JSON.parse(savedData);
            } else {
                events = JSON.parse(JSON.stringify(defaultEvents)); // 深拷貝預設資料
                saveDataToStorage();
            }
        } catch (e) {
            console.error("無法讀取儲存空間:", e);
            events = JSON.parse(JSON.stringify(defaultEvents));
        }

        function saveDataToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
            } catch (e) {
                console.error("儲存失敗:", e);
                showToast('瀏覽器儲存空間異常，資料可能遺失。');
            }
        }

        // 工具函數
        function timeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return (hours - START_HOUR) * 60 + minutes;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden');
            toast.classList.add('toast-enter');
            
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-enter');
            }, 2500);
        }

        // --- 手機版視圖切換邏輯 ---
        function changeMobileDay(delta) {
            currentMobileDay += delta;
            if (currentMobileDay > 7) currentMobileDay = 1;
            if (currentMobileDay < 1) currentMobileDay = 7;
            
            document.getElementById('mobile-day-label').innerText = dayNames[currentMobileDay];
            applyMobileViewFilter();
        }

        function applyMobileViewFilter() {
            // 控制 Header 和 Column 在手機版只顯示 active day
            for (let i = 1; i <= 7; i++) {
                const header = document.getElementById(`day-header-${i}`);
                const col = document.getElementById(`day-col-${i}`);
                
                if (i === currentMobileDay) {
                    if(header) { header.classList.remove('hidden'); header.classList.add('block', 'md:block'); }
                    if(col) { col.classList.remove('hidden'); col.classList.add('block', 'md:block'); }
                } else {
                    if(header) { header.classList.add('hidden', 'md:block'); header.classList.remove('block'); }
                    if(col) { col.classList.add('hidden', 'md:block'); col.classList.remove('block'); }
                }
            }
            updateCurrentTime(); // 重新計算紅線位置
        }


        //        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const headerRow = document.getElementById('calendar-header-row');
            const linesContainer = document.getElementById('grid-lines-container');
            
            // 清理舊資料 (保留 time-axis 和 background lines)
            const oldCols = grid.querySelectorAll('.day-column');
            oldCols.forEach(col => col.remove());
            
            const oldTimeAxis = grid.querySelector('.time-axis');
            if(oldTimeAxis) oldTimeAxis.remove();
            
            const oldHeaders = headerRow.querySelectorAll('.day-header-cell');
            oldHeaders.forEach(h => h.remove());
            
            linesContainer.innerHTML = '';

            const totalHours = END_HOUR - START_HOUR;
            const totalHeight = totalHours * 60 * PIXELS_PER_MINUTE;
            grid.style.height = `${totalHeight}px`;

            // 1. 渲染水平網格虛線 (背景)
            for (let i = 0; i <= totalHours; i++) {
                const line = document.createElement('div');
                line.className = 'absolute w-full border-b border-slate-200';
                line.style.top = `${i * 60 * PIXELS_PER_MINUTE}px`;
                if(i !== totalHours) {
                    // 半點虛線
                    const halfLine = document.createElement('div');
                    halfLine.className = 'absolute w-full border-b border-dashed border-slate-100';
                    halfLine.style.top = `${(i + 0.5) * 60 * PIXELS_PER_MINUTE}px`;
                    linesContainer.appendChild(halfLine);
                }
                linesContainer.appendChild(line);
            }

            // 2. 渲染左側時間軸
            const timeAxis = document.createElement('div');
            timeAxis.className = 'time-axis relative';
            for (let i = 0; i <= totalHours; i++) {
                const hour = START_HOUR + i;
                const label = document.createElement('div');
                label.className = 'absolute w-full text-center md:text-right md:pr-2 text-[10px] md:text-xs text-slate-500 font-medium bg-white';
                label.style.top = `${i * 60 * PIXELS_PER_MINUTE - 8}px`; 
                label.innerText = `${hour.toString().padStart(2, '0')}:00`;
                timeAxis.appendChild(label);
            }
            grid.appendChild(timeAxis);

            // 3. 渲染 7 天的欄位與表頭
            for (let day = 1; day <= 7; day++) {
                // 表頭
                const headerCell = document.createElement('div');
                headerCell.id = `day-header-${day}`;
                headerCell.className = `day-header-cell flex-1 text-center py-2 md:py-3 font-semibold text-slate-700 border-r border-slate-200 hidden md:block`;
                
                // 今天特別標示
                const today = new Date().getDay() || 7;
                if (day === today) {
                    headerCell.innerHTML = `<span class="bg-blue-600 text-white px-2 py-0.5 rounded-full text-sm shadow-sm">${dayNames[day]}</span>`;
                } else {
                    headerCell.innerText = dayNames[day];
                }
                headerRow.appendChild(headerCell);

                // 行程欄位
                const col = document.createElement('div');
                col.id = `day-col-${day}`;
                col.className = 'day-column cursor-pointer hover:bg-blue-50/20 transition-colors hidden md:block z-10'; 
                
                // 點擊空白處新增
                col.addEventListener('click', (e) => {
                    if (e.target.closest('.event-card')) return;
                    const rect = col.getBoundingClientRect();
                    const y = e.clientY - rect.top;
                    let clickedMinutes = (y / PIXELS_PER_MINUTE) + (START_HOUR * 60);
                    
                    clickedMinutes = Math.floor(clickedMinutes / 30) * 30;
                    clickedMinutes = Math.max(START_HOUR * 60, Math.min((END_HOUR * 60) - 30, clickedMinutes));
                    
                    const startHour = Math.floor(clickedMinutes / 60).toString().padStart(2, '0');
                    const startMin = (clickedMinutes % 60).toString().padStart(2, '0');
                    const startStr = `${startHour}:${startMin}`;

                    let endMinutes = clickedMinutes + 60; 
                    endMinutes = Math.min(END_HOUR * 60, endMinutes); 
                    const endHour = Math.floor(endMinutes / 60).toString().padStart(2, '0');
                    const endMin = (endMinutes % 60).toString().padStart(2, '0');
                    const endStr = `${endHour}:${endMin}`;

                    openModal(day.toString(), startStr, endStr);
                });
                
                // 渲染該天的行程 (包含重疊計算)
                const dayEvents = events.filter(e => parseInt(e.day) === day);
                dayEvents.sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
                
                let clusters = [];
                let currentCluster = [];
                let clusterEnd = -1;

                dayEvents.forEach(event => {
                    const startMin = timeToMinutes(event.start);
                    const endMin = timeToMinutes(event.end);
                    if (currentCluster.length === 0) {
                        currentCluster.push(event);
                        clusterEnd = endMin;
                    } else if (startMin < clusterEnd) {
                        currentCluster.push(event);
                        clusterEnd = Math.max(clusterEnd, endMin);
                    } else {
                        clusters.push(currentCluster);
                        currentCluster = [event];
                        clusterEnd = endMin;
                    }
                });
                if (currentCluster.length > 0) clusters.push(currentCluster);

                clusters.forEach(cluster => {
                    let cols = [];
                    cluster.forEach(event => {
                        const startMin = timeToMinutes(event.start);
                        let placed = false;
                        for (let i = 0; i < cols.length; i++) {
                            const lastEventEnd = timeToMinutes(cols[i][cols[i].length - 1].end);
                            if (startMin >= lastEventEnd) {
                                cols[i].push(event);
                                event.colIndex = i;
                                placed = true;
                                break;
                            }
                        }
                        if (!placed) {
                            cols.push([event]);
                            event.colIndex = cols.length - 1;
                        }
                    });
                    cluster.forEach(event => { event.numCols = cols.length; });
                });

                dayEvents.forEach(event => {
                    const topMin = timeToMinutes(event.start);
                    const endMin = timeToMinutes(event.end);
                    const duration = endMin - topMin;
                    
                    const el = document.createElement('div');
                    const colorClass = themeClasses[event.color] || themeClasses.green;
                    
                    el.className = `event-card flex flex-col ${colorClass}`;
                    el.style.top = `${topMin * PIXELS_PER_MINUTE}px`;
                    el.style.height = `${duration * PIXELS_PER_MINUTE}px`;
                    
                    const leftPercent = (event.colIndex / event.numCols) * 100;
                    const widthPercent = (1 / event.numCols) * 100;
                    el.style.left = `calc(${leftPercent}% + 2px)`;
                    el.style.width = `calc(${widthPercent}% - 4px)`;
                    
                    let innerHTML = `
                        <div class="font-bold truncate text-[11px] md:text-sm leading-tight ${event.type !== 'fixed' ? 'pr-4' : ''}">${event.title}</div>
                        <div class="text-[9px] md:text-[10px] opacity-85 mt-[1px] md:mt-0.5 flex items-center">
                            <i class="fa-regular fa-clock mr-1 scale-75 hidden md:inline"></i>${event.start}
                        </div>
                    `;
                    
                    if (event.type !== 'fixed') {
                        innerHTML += `
                            <button onclick="deletePlanQuick(event, '${event.id}')" class="absolute top-0.5 right-0.5 md:top-1 md:right-1 w-5 h-5 flex items-center justify-center rounded hover:bg-black/10 text-current opacity-60 hover:opacity-100 transition-all z-20">
                                <i class="fa-solid fa-xmark text-xs md:text-sm"></i>
                            </button>
                        `;
                    }
                    
                    if (event.notes) {
                        innerHTML += `<div class="mt-auto text-[9px] opacity-70 truncate"><i class="fa-regular fa-file-lines mr-1"></i><span class="hidden md:inline">${event.notes}</span></div>`;
                    }
                    el.innerHTML = innerHTML;
                    
                    el.addEventListener('click', (e) => {
                        e.stopPropagation(); 
                        editPlan(event.id);
                    });
                    
                    col.appendChild(el);
                });

                grid.appendChild(col);
            }
            
            applyMobileViewFilter();
            document.getElementById('mobile-day-label').innerText = dayNames[currentMobileDay];
        }


        //        const modal = document.getElementById('plan-modal');

        function showError(msg) {
            const errorDiv = document.getElementById('error-msg');
            document.getElementById('error-text').innerText = msg;
            errorDiv.classList.remove('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 3500);
        }

        function openModalFromButton() {
            // 手機版新增時，預設帶入目前顯示的星期
            const isMobile = window.innerWidth < 768;
            let targetDay = isMobile ? currentMobileDay.toString() : (new Date().getDay() || 7).toString();
            openModal(targetDay, '12:00', '13:00');
        }

        function openModal(defaultDay = '1', defaultStart = '12:00', defaultEnd = '13:00', editData = null) {
            modal.classList.remove('hidden');
            // Trigger reflow for animation
            void modal.offsetWidth; 
            modal.classList.add('flex', 'modal-enter');
            modal.classList.remove('opacity-0');
            
            document.getElementById('error-msg').classList.add('hidden');
            
            const isFixed = editData && editData.type === 'fixed';
            
            const fixedInputs = ['plan-title', 'plan-day', 'plan-start', 'plan-end'];
            fixedInputs.forEach(id => {
                const el = document.getElementById(id);
                el.disabled = isFixed;
                if(isFixed) {
                    el.classList.add('bg-slate-100', 'text-slate-500');
                } else {
                    el.classList.remove('bg-slate-100', 'text-slate-500');
                }
            });
            
            if (editData) {
                document.getElementById('modal-title').innerHTML = isFixed ? '<i class="fa-solid fa-thumbtack text-blue-500 mr-2"></i>編輯標籤/備註' : '<i class="fa-solid fa-pen-to-square text-blue-500 mr-2"></i>編輯計畫';
                document.getElementById('plan-id').value = editData.id;
                document.getElementById('plan-title').value = editData.title;
                document.getElementById('plan-day').value = editData.day;
                document.getElementById('plan-start').value = editData.start;
                document.getElementById('plan-end').value = editData.end;
                document.getElementById('plan-notes').value = editData.notes || '';
                
                const radios = document.getElementsByName('plan-color');
                const targetColor = editData.color || (isFixed ? 'blue' : 'green');
                for(let r of radios) { r.checked = (r.value === targetColor); }
                
                if (isFixed) {
                    document.getElementById('delete-btn').classList.add('hidden');
                } else {
                    document.getElementById('delete-btn').classList.remove('hidden');
                }
            } else {
                document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-calendar-plus text-blue-500 mr-2"></i>新增個人計畫';
                document.getElementById('plan-id').value = '';
                document.getElementById('plan-title').value = '';
                document.getElementById('plan-day').value = defaultDay;
                document.getElementById('plan-start').value = defaultStart;
                document.getElementById('plan-end').value = defaultEnd;
                document.getElementById('plan-notes').value = '';
                
                document.getElementsByName('plan-color')[1].checked = true; // Default Green
                
                document.getElementById('delete-btn').classList.add('hidden');
            }
            
            if (!isFixed && window.innerWidth >= 768) {
                setTimeout(() => document.getElementById('plan-title').focus(), 300);
            }
        }

        function closeModal() {
            modal.classList.remove('modal-enter');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300); // 配合 CSS transition 延遲隱藏
        }

        function savePlan() {
            const id = document.getElementById('plan-id').value;
            const title = document.getElementById('plan-title').value.trim();
            const day = document.getElementById('plan-day').value;
            const start = document.getElementById('plan-start').value;
            const end = document.getElementById('plan-end').value;
            const notes = document.getElementById('plan-notes').value.trim();
            
            let color = 'green';
            const colorRadios = document.getElementsByName('plan-color');
            for(let r of colorRadios) { if(r.checked) color = r.value; }

            const existingPlanIndex = id ? events.findIndex(e => e.id === id) : -1;
            const isFixed = existingPlanIndex !== -1 && events[existingPlanIndex].type === 'fixed';

            if (!isFixed) {
                if (!title) { showError('請填寫行程名稱'); return; }
                if (!start || !end) { showError('請設定完整的時間'); return; }
                if (start >= end) { showError('結束時間必須晚於開始時間'); return; }
                if (timeToMinutes(start) < 0 || timeToMinutes(end) > (END_HOUR - START_HOUR) * 60) {
                    showError(`時間需在 ${START_HOUR}:00 至 ${END_HOUR}:00 之間`); return;
                }
            }

            if (id && existingPlanIndex !== -1) {
                if (isFixed) {
                    events[existingPlanIndex].notes = notes;
                    events[existingPlanIndex].color = color;
                } else {
                    events[existingPlanIndex] = { ...events[existingPlanIndex], title, day: parseInt(day), start, end, notes, color };
                }
                showToast('計畫已更新儲存');
            } else {
                const planData = { id: 'custom_' + Date.now(), day: parseInt(day), start, end, title, type: 'custom', color, notes };
                events.push(planData);
                showToast('已新增計畫');
                
                // 如果在手機版，新增後自動切換到該行程所在的星期
                if(window.innerWidth < 768 && currentMobileDay !== parseInt(day)) {
                    currentMobileDay = parseInt(day);
                }
            }

            saveDataToStorage();
            closeModal();
            renderCalendar();
        }

        function deleteCurrentPlan() {
            const id = document.getElementById('plan-id').value;
            if(id) {
                events = events.filter(e => e.id !== id);
                saveDataToStorage();
                closeModal();
                renderCalendar();
                showToast('計畫已刪除');
            }
        }

        function deletePlanQuick(e, id) {
            e.stopPropagation(); 
            events = events.filter(ev => ev.id !== id);
            saveDataToStorage();
            closeModal(); 
            renderCalendar();
            showToast('計畫已刪除');
        }

        //        function updateCurrentTime() {
            const existingLine = document.getElementById('current-time-indicator');
            if (existingLine) existingLine.remove();

            const now = new Date();
            let dayOfWeek = now.getDay() || 7; 
            const hours = now.getHours();
            const minutes = now.getMinutes();
            
            if (hours >= START_HOUR && hours < END_HOUR) {
                const totalMins = (hours - START_HOUR) * 60 + minutes;
                const topPos = totalMins * PIXELS_PER_MINUTE;

                // 只有當「當天」欄位顯示時才畫紅線
                const todayCol = document.getElementById(`day-col-${dayOfWeek}`);
                if (todayCol && !todayCol.classList.contains('hidden')) {
                    const indicator = document.createElement('div');
                    indicator.id = 'current-time-indicator';
                    indicator.className = 'current-time-line';
                    indicator.style.top = `${topPos}px`;
                    
                    const dot = document.createElement('div');
                    dot.className = 'current-time-dot';
                    indicator.appendChild(dot);
                    
                    todayCol.appendChild(indicator);
                }
            }
        }

        // 防抖動(Debounce) 處理視窗縮放
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                applyMobileViewFilter();
            }, 100);
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            
            const now = new Date();
            const hours = now.getHours();
            const scrollArea = document.getElementById('calendar-scroll-area');
            
            if (hours >= START_HOUR && hours < END_HOUR) {
                scrollArea.scrollTop = Math.max(0, (hours - START_HOUR - 1) * 60 * PIXELS_PER_MINUTE);
            } else {
                scrollArea.scrollTop = 2 * 60 * PIXELS_PER_MINUTE; 
            }
            
            setInterval(updateCurrentTime, 60000);
        });
    </script>
</body>
